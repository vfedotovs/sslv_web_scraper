services:
  db:
    build: ./src/db
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: new_docker_user
      POSTGRES_DB: new_docker_db
    volumes:
      - db_data:/var/lib/postgresql/data
    # Health check configuration
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U new_docker_user -d new_docker_db"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - postgresql
  ws:
    build:
      context: ./src/ws
      cache_from:
        - sslv-ws:latest
    image: sslv-ws:latest
    restart: always
    environment:
      DEST_EMAIL: ${DEST_EMAIL}
      SRC_EMAIL: ${SRC_EMAIL}
      RELEASE_VERSION: ${RELEASE_VERSION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      CITY_MAIN_URL: ${CITY_MAIN_URL}
      EMAIL_CITY_TITLE: ${EMAIL_CITY_TITLE}
      # Scraper control variables (can be set per-city in .env.<city>)
      SCRAPE_URL_LIMIT: ${SCRAPE_URL_LIMIT:-5}
      SCRAPE_DELAY_SEC: ${SCRAPE_DELAY_SEC:-5}
      SCRAPE_LIST_DELAY_SEC: ${SCRAPE_LIST_DELAY_SEC:-1}
      # Monitoring alert thresholds (M6 Item 3, see alert_mailer.py)
      ALERT_REMOVED_PCT: ${ALERT_REMOVED_PCT:-30}
      ALERT_ZERO_NEW_RUNS: ${ALERT_ZERO_NEW_RUNS:-3}
      DB_HOST: db
      DB_NAME: new_docker_db
      DB_USER: new_docker_user
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    # ports:
    #   - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/docs').read()\" || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    networks:
      - postgresql
  ts:
    build:
      context: ./src/ts
      cache_from:
        - sslv-ts:latest
    image: sslv-ts:latest
    restart: always
    environment:
      WS_HOST: ws
      CITY: ${CITY:-ogre}
    # Health check port is only accessible within Docker network (no external exposure needed)
    # ports:
    #   - "8080:8080"  # Uncomment only if you need external monitoring
    depends_on:
      ws:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health').read()\" || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
      - postgresql
  # One-shot debug trigger (kept for manual single-city testing only).
  # In multi-city deploys, immediate post-deploy trigger is handled inside
  # deploy-multi-city-ws.sh using a temporary container (with correct CITY).
  # To run manually: docker compose --profile debug up -d curl
  # (Note: still hardcoded to ogre in the compose definition)
  curl:
    image: curlimages/curl
    command: sh -c "sleep 30 && curl http://ws:8000/run-task/ogre"
    profiles: ["debug"]
    networks:
      - postgresql
    depends_on:
      - ts

  # DB Backup Service (dedicated container for scheduled backups)
  # Runs cron inside the container (src/backup-svc).
  # Uses shared image name "sslv-backup:latest" so only one backup image is built
  # across all cities (reduces build time and disk usage).
  # Deployed per-city via --project-name <city> (container name becomes {city}-backup-1).
  # The deploy-multi-city-ws.sh always includes --profile backup.
  # For manual/single-city: docker compose --profile backup up -d
  # Uses S3_BUCKET from .env (set per-city to *-db-backups).
  # CITY/ENV passed for awareness (add CITY=xxx to .env.city if needed for logging/fallback).
  backup:
    build:
      context: ./src/backup-svc
      cache_from:
        - sslv-backup:latest
    image: sslv-backup:latest
    restart: always
    profiles: ["backup"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_USER: new_docker_user
      DB_NAME: new_docker_db
      DB_HOST: db
      S3_BUCKET: ${S3_BUCKET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      CITY: ${CITY:-unknown}
      ENV: ${ENV:-prod}
      # Set to DEBUG for verbose logging (also written to /var/log/backup.log inside container)
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - postgresql

