---
name: Test and deploy to staging

# Manual and confirmed only, like main.yml (R-0). The old job removed every
# container and image on the staging host, cloned a new <time>-deploy folder
# per run and started the single-city stack (make setup/build/up); its runs
# also left orphan <time>-deploy_* volumes behind.
#
# Now: test the exact commit, build every image, then deploy that commit with
# `make deploy-staging` in the host's ONE deploy dir (the watchdog runs from
# it too), so a second deployment can never run next to the first.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit to deploy (resolved to a commit SHA)'
        required: true
        default: 'release-2.0.0'
      confirm:
        description: 'Type deploy-staging to deploy all cities to STAGING'
        required: true
        default: ''

jobs:
  Test:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Record tested commit
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install pytest
          python -m pip install coverage
          python -m pip install httpx  # FastAPI TestClient (tests/test_11_status_endpoint.py)
          pip install -r ./src/ws/requirements.txt
          pip install -r ./src/ts/requirements.txt
      - name: Run pytest with coverage
        # No continue-on-error: a failing test must stop the deploy.
        run: coverage run -m pytest
      - name: Coverage report
        if: always()
        run: coverage xml -o coverage.xml
      - name: Upload coverage reports to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          name: coverage-report
          files: coverage.xml
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  Build:
    # Every image must build (Dockerfiles, requirements, the backup image's
    # pg_dump 15 guard) before anything reaches the host. No secrets needed.
    needs: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.Test.outputs.sha }}
      - name: Placeholder database.ini (the ws image copies it)
        run: printf '[postgresql]\nhost=db\ndatabase=ci\nuser=ci\npassword=ci\n' > src/ws/database.ini
      - name: Build db, ws, ts and backup images
        run: docker compose --profile backup build

  Deploy:
    needs: [Test, Build]
    runs-on: ubuntu-latest
    # Manual and confirmed only.
    if: github.event_name == 'workflow_dispatch' && inputs.confirm == 'deploy-staging'
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - name: Set up SSH key
        run: |
          echo "${{ secrets.DEV_EC2_PRIVATE_KEY }}" > private_key
          chmod 600 private_key
      - name: Deploy all cities to staging EC2
        env:
          HOSTNAME: ${{ secrets.DEV_EC2_IP }}
          USER_NAME: ${{ secrets.DEV_EC2_USER }}
          DEPLOY_REF: ${{ inputs.ref }}
          DEPLOY_SHA: ${{ needs.Test.outputs.sha }}
          # The host's single deploy dir, relative to $HOME (repo variable to change it).
          DEPLOY_DIR: ${{ vars.STAGING_DEPLOY_DIR || 'test-staging-1-7-9-23' }}
        run: |
          # Values are passed as arguments, not spliced into the remote script.
          ssh -o StrictHostKeyChecking=no -i private_key "${USER_NAME}@${HOSTNAME}" \
            'bash -s' -- "$DEPLOY_REF" "$DEPLOY_SHA" "$DEPLOY_DIR" <<'EOF'
            set -euo pipefail
            ref="$1"; sha="$2"; dir="$HOME/$3"

            # The running deploy itself, as make starts it (not any process that
            # merely mentions the script name, e.g. an editor or a log tail).
            if pgrep -f '^(/usr)?(/bin/)?bash \./deploy-multi-city-ws\.sh' > /dev/null; then
              echo "A deploy is already running on this host; not starting another." >&2
              exit 1
            fi
            if [ ! -d "$dir/.git" ]; then
              echo "=== No deploy dir yet: cloning into ${dir} ==="
              git clone --quiet https://github.com/vfedotovs/sslv_web_scraper.git "$dir"
            fi
            cd "$dir"
            if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
              echo "${dir} has uncommitted changes to tracked files; not deploying over them:" >&2
              git status --short --untracked-files=no >&2
              exit 1
            fi

            echo "=== Checking out ${ref} (${sha}) in ${dir} ==="
            git fetch --quiet --tags origin
            if git show-ref --verify --quiet "refs/remotes/origin/${ref}"; then
              git checkout --quiet -B "$ref" "origin/${ref}"   # stay on the branch for later git pull
            else
              git checkout --quiet --detach "$sha"
            fi
            if [ "$(git rev-parse HEAD)" != "$sha" ]; then
              echo "${ref} moved since the tests ran (now $(git rev-parse --short HEAD), tested ${sha:0:7}); not deploying." >&2
              exit 1
            fi

            echo "=== Deploying all cities: $(git describe --tags --always) (staging) ==="
            # make deploy-staging: CICD bucket pre-flight, deploy-multi-city-ws.sh
            # (per-city build + up, RELEASE_VERSION from git describe, APP_ENV=staging,
            # post-deploy run check) and watchdog timer restart. Compose replaces each
            # city's containers in place; DB volumes and other containers are untouched.
            make deploy-staging

            echo "=== Deployment complete ==="
            docker ps --format '{{.Names}}\t{{.Status}}' | sort
          EOF
      - name: Remove SSH key
        if: always()
        run: rm -f private_key
